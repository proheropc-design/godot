name: Godot Engine Custom Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-godot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev

    - name: Setup Cache for SCons
      uses: actions/cache@v4
      with:
        path: ~/.scons_cache
        key: scons-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          scons-${{ runner.os }}-

    - name: Compile Godot Engine
      run: |
        scons platform=linuxbsd target=editor dev_build=no use_scons_cache=yes -j2

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: godot-custom-editor
        path: bin/godot.linuxbsd.editor.x86_64
