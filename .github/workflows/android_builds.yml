name: Build Custom Godot Android Editor

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SCons & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential

      - name: Build Android Editor APK
        run: |
          scons platform=android target=editor arch=arm64 -j4

      - name: Upload APK Asset
        uses: actions/upload-artifact@v3
        with:
          name: Custom-Godot-Android-Editor
          path: bin/*.apk
