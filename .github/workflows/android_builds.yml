name: Build Custom Godot Android Editor

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & SDK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev

      - name: Build Android Editor APK
        run: |
          scons platform=android target=editor arch=arm64 -j4

      - name: Upload APK Asset
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Godot-Android-Editor
          path: bin/*.apk
